name: Build and publish release

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name for the release (for example v1.1.3.2)'
        required: true
        type: string
      release_name:
        description: 'Release name'
        required: true
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      
      - name: Checkout project
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
            
      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: maven

      - name: Set up Node.js 14
        uses: actions/setup-node@v4
        with:
          node-version: '14'

      - name: Install frontend dependencies
        working-directory: ./sdnnt/src/main/ui
        run: npm install

      - name: Build with Maven
        run: mvn -B install --file pom.xml

      - name: Prepare release files
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          mkdir -p release
          cp sdnnt/target/*.war "release/sdnnt-${RELEASE_TAG}.war"
          zip -r "release/solr-${RELEASE_TAG}.zip" solr -x '*/data/*'

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag_name || github.ref_name }}
          name: ${{ inputs.release_name || format('SDNNT {0}', github.ref_name) }}
          files: |
            release/*.war
            release/*.zip
          generate_release_notes: true
          draft: true
