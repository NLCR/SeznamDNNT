name: Build and publish release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      
      - name: Checkout project
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version from pom.xml
        id: version
        run: |
          VERSION=$(python3 -c 'import xml.etree.ElementTree as ET; root = ET.parse("pom.xml").getroot(); print(root.find("{http://maven.apache.org/POM/4.0.0}version").text)')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Fail if release already exists
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: v${{ steps.version.outputs.version }}
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Release $RELEASE_TAG already exists"
            exit 1
          fi
            
      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: maven

      - name: Set up Node.js 14
        uses: actions/setup-node@v4
        with:
          node-version: '14'

      - name: Install frontend dependencies
        working-directory: ./sdnnt/src/main/ui
        run: npm install

      - name: Build with Maven
        run: mvn -B install --file pom.xml

      - name: Prepare release files
        run: |
          mkdir -p release
          cp sdnnt/target/*.war release/sdnnt.war
          zip -r release/solr.zip solr -x '*/data/*'

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: SDNNT ${{ steps.version.outputs.version }}
          files: |
            release/*.war
            release/*.zip
          generate_release_notes: true
          draft: true
